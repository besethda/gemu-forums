<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2240 1120" width="2240" height="1120" role="img" aria-labelledby="title desc"><title id="title">Gemu site map</title><desc id="desc">Three main pages: Home, Community and Assets. Engine, showcase, publishing, Bootcamp and partners stay on the homepage. Detail panels and forms remain within their page.</desc><rect x="0" y="0" width="2240" height="1120" rx="10" fill="#f7f9fb"/><rect x="780" y="55" width="680" height="130" rx="10" fill="#edf3f8" stroke="#bec8cf" stroke-width="2"/><text x="810" y="109" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#202c36">Main navigation</text><text x="810" y="153" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#52616c">Home · Community · Assets</text><path d="M1120 185 L1120 222" fill="none" stroke="#bec8cf" stroke-width="2"/><path d="M400 222 L1840 222" fill="none" stroke="#bec8cf" stroke-width="2"/><path d="M400 222 L400 270" fill="none" stroke="#bec8cf" stroke-width="2"/><rect x="60" y="270" width="680" height="740" rx="10" fill="#ffffff" stroke="#bec8cf" stroke-width="2"/><rect x="60" y="270" width="680" height="108" rx="10" fill="#edf3f8" stroke="#bec8cf" stroke-width="2"/><text x="88" y="327" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#202c36">Home</text><text x="88" y="364" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52616c">/</text><text x="88" y="438" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#202c36">Engine &amp; showcase</text><text x="88" y="482" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#52616c">Engine introduction, capabilities and approved project</text><text x="88" y="518" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#52616c">media on the homepage.</text><text x="88" y="589" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#202c36">Publishing &amp; Bootcamp</text><text x="88" y="633" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#52616c">Short homepage sections with pitch and interest</text><text x="88" y="669" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#52616c">actions.</text><text x="88" y="740" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#202c36">Investors &amp; licensing</text><text x="88" y="784" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#52616c">Partner information as a homepage section.</text><text x="88" y="855" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#202c36">Application dialogs</text><text x="88" y="899" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#52616c">Request access, Submit a game and enquiries. Each</text><text x="88" y="935" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#52616c">has its own intent and confirmation state.</text><path d="M1120 222 L1120 270" fill="none" stroke="#bec8cf" stroke-width="2"/><rect x="780" y="270" width="680" height="740" rx="10" fill="#ffffff" stroke="#bec8cf" stroke-width="2"/><rect x="780" y="270" width="680" height="108" rx="10" fill="#edf3f8" stroke="#bec8cf" stroke-width="2"/><text x="808" y="327" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#202c36">Community</text><text x="808" y="364" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52616c">/community</text><text x="808" y="438" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#202c36">Searchable questions</text><text x="808" y="482" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#52616c">Search and filter developer discussions.</text><text x="808" y="553" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#202c36">Discussion panel</text><text x="808" y="597" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#52616c">Open a topic and its replies within this page.</text><text x="808" y="668" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#202c36">Ask / reply dialog</text><text x="808" y="712" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#52616c">Create a question or reply without a separate page.</text><text x="808" y="783" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#202c36">Discord connection</text><text x="808" y="827" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#52616c">The same discussion connects to a Discord thread</text><text x="808" y="863" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#52616c">through the proposed bot and backend.</text><path d="M1840 222 L1840 270" fill="none" stroke="#bec8cf" stroke-width="2"/><rect x="1500" y="270" width="680" height="740" rx="10" fill="#ffffff" stroke="#bec8cf" stroke-width="2"/><rect x="1500" y="270" width="680" height="108" rx="10" fill="#edf3f8" stroke="#bec8cf" stroke-width="2"/><text x="1528" y="327" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#202c36">Assets</text><text x="1528" y="364" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52616c">/assets</text><text x="1528" y="438" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#202c36">Browse &amp; search</text><text x="1528" y="482" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#52616c">Explore voxel models, environments and tools.</text><text x="1528" y="553" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#202c36">Asset detail panel</text><text x="1528" y="597" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#52616c">Preview, compatibility, creator and license within this</text><text x="1528" y="633" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#52616c">page.</text><text x="1528" y="704" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#202c36">Get asset</text><text x="1528" y="748" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#52616c">Show the acquisition step as a dialog or linked service.</text><text x="1528" y="819" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#202c36">Creator submission dialog</text><text x="1528" y="863" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#52616c">Share or sell work through a form; review and</text><text x="1528" y="899" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#52616c">publication remain a separate flow.</text></svg>