<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2240 1060" width="2240" height="1060" role="img" aria-labelledby="title desc"><title id="title">Gemu simplified user flows</title><desc id="desc">Home actions open application dialogs and lead to confirmation and Gemu follow-up. Community supports finding or asking questions and reading or replying in one discussion connected to Discord. Assets supports browsing and acquiring an asset, with a separate creator submission branch.</desc><rect x="0" y="0" width="2240" height="1060" rx="10" fill="#f7f9fb"/><text x="60" y="55" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#52616c">Forms open in dialogs · Details open in panels · Dashed arrows show the proposed Discord connection</text><rect x="60" y="100" width="300" height="142" rx="10" fill="#edf3f8" stroke="#bec8cf" stroke-width="2"/><text x="85" y="152" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#202c36">Home</text><text x="85" y="195" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52616c">Engine, publishing,</text><text x="85" y="228" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52616c">Bootcamp, partners</text><rect x="430" y="100" width="510" height="142" rx="10" fill="#edf3f8" stroke="#bec8cf" stroke-width="2"/><text x="455" y="152" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#202c36">Choose an action</text><text x="455" y="195" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52616c">Request access, submit a game, register</text><text x="455" y="228" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52616c">interest or enquire</text><rect x="1010" y="100" width="470" height="142" rx="10" fill="#fff5df" stroke="#bec8cf" stroke-width="2"/><text x="1035" y="152" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#202c36">Application dialog</text><text x="1035" y="195" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52616c">Complete the relevant form</text><rect x="1550" y="100" width="630" height="142" rx="10" fill="#fff5df" stroke="#bec8cf" stroke-width="2"/><text x="1575" y="152" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#202c36">Confirmation &amp; follow-up</text><text x="1575" y="195" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52616c">Gemu reviews it and explains the next steps</text><path d="M360 171 L418 171" fill="none" stroke="#52616c" stroke-width="3"/><polygon points="418,171 407,165 407,177" fill="#52616c"/><path d="M940 171 L998 171" fill="none" stroke="#52616c" stroke-width="3"/><polygon points="998,171 987,165 987,177" fill="#52616c"/><path d="M1480 171 L1538 171" fill="none" stroke="#52616c" stroke-width="3"/><polygon points="1538,171 1527,165 1527,177" fill="#52616c"/><rect x="60" y="345" width="300" height="142" rx="10" fill="#edf3f8" stroke="#bec8cf" stroke-width="2"/><text x="85" y="397" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#202c36">Community</text><text x="85" y="440" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52616c">Developer questions</text><rect x="430" y="345" width="510" height="142" rx="10" fill="#edf3f8" stroke="#bec8cf" stroke-width="2"/><text x="455" y="397" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#202c36">Find or ask a question</text><text x="455" y="440" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52616c">Search existing topics or open the question</text><text x="455" y="473" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52616c">dialog</text><rect x="1010" y="345" width="470" height="142" rx="10" fill="#edf3f8" stroke="#bec8cf" stroke-width="2"/><text x="1035" y="397" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#202c36">Discussion panel</text><text x="1035" y="440" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52616c">Read answers or reply</text><rect x="1550" y="345" width="630" height="142" rx="10" fill="#e8f4ef" stroke="#bec8cf" stroke-width="2"/><text x="1575" y="397" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#202c36">Discord thread</text><text x="1575" y="440" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52616c">The same question and replies</text><path d="M360 416 L418 416" fill="none" stroke="#52616c" stroke-width="3"/><polygon points="418,416 407,410 407,422" fill="#52616c"/><path d="M940 416 L998 416" fill="none" stroke="#52616c" stroke-width="3"/><polygon points="998,416 987,410 987,422" fill="#52616c"/><path d="M1480 400 L1538 400" fill="none" stroke="#52616c" stroke-width="3" stroke-dasharray="8 6"/><polygon points="1538,400 1527,394 1527,406" fill="#52616c"/><path d="M1550 433 L1492 433" fill="none" stroke="#52616c" stroke-width="3" stroke-dasharray="8 6"/><polygon points="1492,433 1503,427 1503,439" fill="#52616c"/><rect x="60" y="590" width="300" height="142" rx="10" fill="#edf3f8" stroke="#bec8cf" stroke-width="2"/><text x="85" y="642" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#202c36">Assets</text><text x="85" y="685" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52616c">Browse or contribute</text><rect x="430" y="590" width="510" height="142" rx="10" fill="#edf3f8" stroke="#bec8cf" stroke-width="2"/><text x="455" y="642" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#202c36">Browse assets</text><text x="455" y="685" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52616c">Search or choose a category</text><rect x="1010" y="590" width="470" height="142" rx="10" fill="#edf3f8" stroke="#bec8cf" stroke-width="2"/><text x="1035" y="642" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#202c36">Asset detail panel</text><text x="1035" y="685" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52616c">Preview, compatibility and license</text><rect x="1550" y="590" width="630" height="142" rx="10" fill="#fff5df" stroke="#bec8cf" stroke-width="2"/><text x="1575" y="642" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#202c36">Get the asset</text><text x="1575" y="685" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52616c">Acquisition and delivery step</text><path d="M360 661 L418 661" fill="none" stroke="#52616c" stroke-width="3"/><polygon points="418,661 407,655 407,667" fill="#52616c"/><path d="M940 661 L998 661" fill="none" stroke="#52616c" stroke-width="3"/><polygon points="998,661 987,655 987,667" fill="#52616c"/><path d="M1480 661 L1538 661" fill="none" stroke="#52616c" stroke-width="3"/><polygon points="1538,661 1527,655 1527,667" fill="#52616c"/><rect x="430" y="835" width="510" height="142" rx="10" fill="#edf3f8" stroke="#bec8cf" stroke-width="2"/><text x="455" y="887" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#202c36">Share or sell work</text><text x="455" y="930" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52616c">Choose the creator route</text><rect x="1010" y="835" width="470" height="142" rx="10" fill="#fff5df" stroke="#bec8cf" stroke-width="2"/><text x="1035" y="887" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#202c36">Submission dialog</text><text x="1035" y="930" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52616c">Introduce the asset</text><rect x="1550" y="835" width="630" height="142" rx="10" fill="#e8f4ef" stroke="#bec8cf" stroke-width="2"/><text x="1575" y="887" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#202c36">Review &amp; listing</text><text x="1575" y="930" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52616c">Review before publishing</text><path d="M210 732 L210 906" fill="none" stroke="#52616c" stroke-width="3"/><path d="M210 906 L418 906" fill="none" stroke="#52616c" stroke-width="3"/><polygon points="418,906 407,900 407,912" fill="#52616c"/><path d="M940 906 L998 906" fill="none" stroke="#52616c" stroke-width="3"/><polygon points="998,906 987,900 987,912" fill="#52616c"/><path d="M1480 906 L1538 906" fill="none" stroke="#52616c" stroke-width="3"/><polygon points="1538,906 1527,900 1527,912" fill="#52616c"/></svg>